name: Deploy PM-Cloud-DCS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-3

      - name: Login ke Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image ke ECR
        run: |
          docker build -t pm-cloud-dcs .
          docker tag pm-cloud-dcs:latest \
            132761312471.dkr.ecr.ap-southeast-3.amazonaws.com/pm-cloud-dcs:latest
          docker push \
            132761312471.dkr.ecr.ap-southeast-3.amazonaws.com/pm-cloud-dcs:latest

      - name: Deploy ke VM Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-southeast-3 \
              | docker login --username AWS --password-stdin \
                132761312471.dkr.ecr.ap-southeast-3.amazonaws.com

            cd ~/pm-cloud-dcs
            docker compose pull
            docker compose down
            docker compose up -d

            sleep 5

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize:clear

            echo "Deploy selesai: $(date)"